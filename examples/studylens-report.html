<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>StudyLens · 学习导航</title>
    <style>
      :root {
        --bg: #f6f7f6;
        --card: #fff;
        --ink: #18241f;
        --muted: #7a8781;
        --faint: #a9b3ae;
        --line: #e6eae8;
        --green: #1f7a5c;
        --soft: #eef5f1;
        --must: #c4473f;
        --must-bg: #fbeceb;
        --normal: #7d8a84;
        --normal-bg: #f0f2f1;
        --speed: #a8700f;
        --speed-bg: #fdf3d8;
        --speed-bar: #dcae4a;
        --skip: #c9d1cd;
        --skip-bg: #f3f5f4;
        color-scheme: light;
      }
      html[data-theme="dark"] {
        --bg: #121a17;
        --card: #19231f;
        --ink: #e6eeea;
        --muted: #92a39b;
        --faint: #62756c;
        --line: #2a3832;
        --green: #7fd0ad;
        --soft: #22332b;
        --must: #ff9a92;
        --must-bg: #47292a;
        --normal: #a9bab2;
        --normal-bg: #26332d;
        --speed: #f3cb72;
        --speed-bg: #423823;
        --speed-bar: #c9a14c;
        --skip: #46574f;
        --skip-bg: #222d28;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 14px;
        line-height: 1.6;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
        border: 0;
        background: none;
        padding: 0;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 2px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      [hidden] {
        display: none !important;
      }
      svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        display: block;
      }
      .wrap {
        max-width: 1280px;
        margin: auto;
        padding: 0 32px 48px;
      }

      /* 顶栏 */
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 0;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.3px;
      }
      .brand-icon {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: var(--ink);
        color: var(--card);
        display: grid;
        place-items: center;
        font: 18px Georgia, serif;
      }
      .icon-button {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        color: var(--muted);
      }
      .icon-button:hover {
        background: var(--soft);
        color: var(--ink);
      }
      #theme-toggle .i-sun,
      html[data-theme="dark"] #theme-toggle .i-moon {
        display: none;
      }
      html[data-theme="dark"] #theme-toggle .i-sun {
        display: block;
      }

      /* 目标与统计 */
      .intro {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 32px;
        padding: 28px 0 36px;
      }
      h1 {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.6px;
        line-height: 1.35;
        max-width: 680px;
      }
      .stats {
        display: flex;
        align-items: baseline;
        gap: 28px;
        flex-shrink: 0;
      }
      .stat {
        display: flex;
        flex-direction: column-reverse;
      }
      .stat-label {
        font-size: 12px;
        color: var(--muted);
      }
      .stat-value {
        font-size: 18px;
        font-weight: 600;
        white-space: nowrap;
        color: var(--muted);
      }
      .stat.saved .stat-value {
        font-size: 36px;
        font-weight: 700;
        letter-spacing: -1px;
        color: var(--green);
        line-height: 1.1;
      }

      /* 从这里开始 */
      .learning {
        margin-bottom: 32px;
      }
      h2 {
        font-size: 15px;
        font-weight: 650;
        margin-bottom: 12px;
      }
      .path {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 10px;
      }
      .path-step {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        text-align: left;
        min-width: 0;
      }
      .path-step:hover {
        border-color: var(--green);
      }
      .step-number {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--soft);
        color: var(--green);
        font-size: 12px;
        font-weight: 700;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .step-title {
        flex: 1;
        min-width: 0;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.45;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .step-meta {
        font-size: 12px;
        color: var(--faint);
        font-variant-numeric: tabular-nums;
      }
      .path-more {
        font-size: 13px;
        color: var(--muted);
        padding: 12px 14px;
        border: 1px dashed var(--line);
        border-radius: 12px;
      }
      .path-more:hover {
        color: var(--green);
        border-color: var(--green);
      }
      .path-empty {
        color: var(--muted);
        font-size: 13px;
      }
      .link-status {
        color: var(--must);
        font-size: 13px;
        margin: -16px 0 16px;
      }

      /* 主体 */
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.3fr);
        gap: 24px;
        align-items: start;
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
        min-width: 0;
      }

      /* 目录 */
      .catalog-head {
        padding: 18px 18px 12px;
      }
      .catalog-title {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .catalog-title h2 {
        margin: 0;
      }
      #catalog-count {
        font-size: 12px;
        color: var(--faint);
      }
      .search {
        width: 100%;
        margin-top: 12px;
        padding: 9px 12px;
        border: 0;
        border-radius: 10px;
        background: var(--bg);
      }
      .search::placeholder {
        color: var(--faint);
      }
      .filters {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
        flex-wrap: wrap;
        font-size: 12px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 99px;
        color: var(--muted);
        cursor: pointer;
        border: 1px solid var(--line);
      }
      .chip:has(input:checked) {
        color: var(--must);
        border-color: var(--must);
        background: var(--must-bg);
      }
      .chip input {
        appearance: none;
        margin: 0;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--faint);
        cursor: pointer;
      }
      .chip input:checked {
        background: var(--must);
      }
      .filters select {
        border: 0;
        background: transparent;
        color: var(--muted);
        padding: 4px 2px;
        cursor: pointer;
        max-width: 150px;
      }
      .filters select:hover {
        color: var(--ink);
      }
      .video-entry {
        border-top: 1px solid var(--line);
      }
      .video-entry summary {
        list-style: none;
        cursor: pointer;
        padding: 14px 18px;
      }
      .video-entry summary::-webkit-details-marker {
        display: none;
      }
      .video-entry summary:hover {
        background: var(--bg);
      }
      .video-top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: baseline;
        margin-bottom: 9px;
      }
      .video-title {
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .video-duration {
        font-size: 12px;
        color: var(--faint);
        white-space: nowrap;
      }
      .mini {
        display: flex;
        height: 5px;
        gap: 2px;
        border-radius: 3px;
        overflow: hidden;
      }
      .mini span {
        min-width: 2px;
        background: var(--normal);
        opacity: 0.55;
      }
      .mini .must {
        background: var(--must);
        opacity: 1;
      }
      .mini .speed {
        background: var(--speed-bar);
        opacity: 1;
      }
      .mini .skip {
        background: var(--skip);
        opacity: 1;
      }
      .video-summary {
        padding: 0 18px 6px;
        font-size: 12px;
        color: var(--muted);
      }
      .segment-list {
        padding: 2px 8px 10px;
      }
      .segment {
        border-radius: 9px;
      }
      .segment.skip {
        opacity: 0.5;
      }
      .segment.active {
        background: var(--soft);
        opacity: 1;
      }
      .segment-jump {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 8px 10px;
        text-align: left;
        border-radius: 9px;
      }
      .segment-jump:hover {
        background: var(--bg);
      }
      .segment.active .segment-jump:hover {
        background: transparent;
      }
      .time {
        font-size: 12px;
        color: var(--green);
        font-variant-numeric: tabular-nums;
        min-width: 38px;
      }
      .segment-name {
        flex: 1;
        min-width: 0;
        font-size: 13px;
      }
      .badge {
        font-size: 11px;
        padding: 1px 7px;
        border-radius: 5px;
        white-space: nowrap;
        flex-shrink: 0;
        background: var(--normal-bg);
        color: var(--normal);
      }
      .badge.must {
        background: var(--must-bg);
        color: var(--must);
      }
      .badge.speed {
        background: var(--speed-bg);
        color: var(--speed);
      }
      .badge.skip {
        background: var(--skip-bg);
        color: var(--muted);
      }
      .empty {
        padding: 32px 18px;
        text-align: center;
        color: var(--muted);
        border-top: 1px solid var(--line);
      }

      /* 播放器 */
      .player-panel {
        position: sticky;
        top: 20px;
      }
      .player-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 12px 12px 12px 18px;
      }
      .player-heading h2 {
        margin: 0;
        font-size: 14px;
        overflow-wrap: anywhere;
      }
      .heading-actions {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
      }
      #video-duration,
      #share-status {
        font-size: 12px;
        color: var(--faint);
        white-space: nowrap;
      }
      #share-status {
        color: var(--green);
      }
      .share-fallback {
        padding: 0 18px 12px;
      }
      .share-fallback input {
        width: 100%;
        padding: 7px 10px;
        font-size: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
      }
      .screen {
        position: relative;
        aspect-ratio: 16/9;
        background: #0f1714;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      video {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
      }
      .play-error {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 24px;
        text-align: center;
        background: #16211d;
        color: #e8f0ec;
      }
      .play-error h3 {
        font-size: 15px;
      }
      .play-error p {
        font-size: 12px;
        color: #a9bdb3;
      }
      .play-error code {
        font-size: 12px;
        color: #c9dbd1;
        overflow-wrap: anywhere;
      }
      .player-controls {
        padding: 14px 14px 10px;
      }
      .seek {
        width: 100%;
        margin: 0;
        height: 6px;
        accent-color: var(--green);
        cursor: pointer;
      }
      .seek-strip {
        position: relative;
        margin: 6px 2px 0;
        height: 14px;
        gap: 3px;
        align-items: center;
        overflow: visible;
      }
      .seek-strip button {
        height: 4px;
        min-width: 4px;
        border-radius: 2px;
        background: var(--normal);
        opacity: 0.45;
        cursor: pointer;
      }
      .seek-strip button.must {
        background: var(--must);
        opacity: 0.85;
      }
      .seek-strip button.speed {
        background: var(--speed-bar);
        opacity: 0.85;
      }
      .seek-strip button.skip {
        background: var(--skip);
        opacity: 1;
      }
      .seek-strip button:hover,
      .seek-strip button:focus-visible,
      .seek-strip button.active {
        height: 8px;
        opacity: 1;
      }
      .strip-tip {
        position: absolute;
        bottom: calc(100% + 6px);
        transform: translateX(-50%);
        z-index: 5;
        max-width: min(340px, 100%);
        padding: 6px 10px;
        border-radius: 8px;
        background: var(--ink);
        color: var(--card);
        font-size: 12px;
        line-height: 1.45;
        pointer-events: none;
        white-space: normal;
        width: max-content;
      }
      .strip-tip b {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        margin-right: 6px;
      }
      .transport {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .transport-left,
      .transport-right {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      #play-toggle {
        background: var(--ink);
        color: var(--card);
        margin-right: 6px;
      }
      #play-toggle:hover {
        background: var(--green);
      }
      #play-toggle svg .fill {
        fill: currentColor;
        stroke: none;
      }
      #play-toggle .i-pause,
      #play-toggle[data-state="playing"] .i-play,
      #mute-toggle .i-muted,
      #mute-toggle[aria-pressed="true"] .i-volume,
      #fullscreen-toggle .i-exit,
      #fullscreen-toggle[data-state="full"] .i-enter {
        display: none;
      }
      #play-toggle[data-state="playing"] .i-pause,
      #mute-toggle[aria-pressed="true"] .i-muted,
      #fullscreen-toggle[data-state="full"] .i-exit {
        display: block;
      }
      #volume {
        width: 64px;
        accent-color: var(--muted);
        margin: 0 8px 0 2px;
      }
      .position {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        margin-left: 4px;
      }
      #base-rate {
        appearance: none;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        padding: 6px 8px;
        cursor: pointer;
      }
      #base-rate:hover {
        background: var(--soft);
        color: var(--ink);
      }
      #control-status {
        font-size: 12px;
        color: var(--must);
        flex-basis: 100%;
      }
      #control-status:empty {
        display: none;
      }
      .smart-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 18px 14px;
      }
      .switch {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        cursor: pointer;
      }
      .switch input {
        appearance: none;
        margin: 0;
        width: 34px;
        height: 20px;
        border-radius: 99px;
        background: var(--line);
        position: relative;
        cursor: pointer;
        flex-shrink: 0;
      }
      .switch input::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--card);
        box-shadow: 0 1px 3px #0003;
      }
      .switch input:checked {
        background: var(--green);
      }
      .switch input:checked::after {
        left: 16px;
      }
      .rate-status {
        font-size: 12px;
        font-weight: 600;
        color: var(--speed);
        background: var(--speed-bg);
        padding: 1px 8px;
        border-radius: 5px;
      }
      .current {
        padding: 18px;
        border-top: 1px solid var(--line);
      }
      .current-top {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .current h3 {
        font-size: 15px;
        font-weight: 650;
      }
      .current p {
        margin-top: 8px;
        color: var(--muted);
        font-size: 13px;
      }
      .current ul {
        margin: 10px 0 0;
        padding-left: 18px;
        font-size: 13px;
      }
      .current ul:empty {
        display: none;
      }
      .current .reason {
        font-size: 12px;
        color: var(--faint);
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 14px;
        max-width: calc(100% - 24px);
        padding: 10px 12px 10px 16px;
        border-radius: 12px;
        background: var(--ink);
        color: var(--card);
        font-size: 13px;
        box-shadow: 0 8px 30px #0003;
      }
      .toast span {
        overflow-wrap: anywhere;
      }
      .toast button {
        white-space: nowrap;
        padding: 4px 10px;
        border-radius: 7px;
        background: var(--card);
        color: var(--ink);
        font-size: 12px;
      }
      .player-panel:fullscreen {
        overflow: auto;
        background: var(--bg);
        padding: 20px;
      }
      .player-panel:fullscreen .screen {
        max-height: 75vh;
      }

      @media (max-width: 1050px) {
        .wrap {
          padding: 0 20px 40px;
        }
        .intro {
          flex-direction: column;
          align-items: flex-start;
          gap: 18px;
        }
      }
      @media (max-width: 720px) {
        .wrap {
          padding: 0 16px 32px;
        }
        .topbar {
          padding: 14px 0;
        }
        .intro {
          padding: 16px 0 24px;
        }
        h1 {
          font-size: 22px;
        }
        .stats {
          gap: 20px;
        }
        .stat.saved .stat-value {
          font-size: 30px;
        }
        .path {
          grid-template-columns: 1fr;
          gap: 8px;
        }
        .learning {
          margin-bottom: 24px;
        }
        .workspace {
          display: flex;
          flex-direction: column;
          gap: 16px;
        }
        .player-panel {
          position: static;
          order: -1;
          width: 100%;
        }
        .catalog-panel {
          width: 100%;
        }
        #volume {
          display: none;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        button,
        .chip,
        .switch input,
        .switch input::after {
          transition:
            background 0.15s,
            border-color 0.15s,
            color 0.15s,
            left 0.15s;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">S</span>StudyLens
        </div>
        <button
          id="theme-toggle"
          class="icon-button"
          type="button"
          aria-pressed="false"
          aria-label="切换深色"
          title="切换深色"
        >
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
        </button>
      </header>

      <section class="intro">
        <h1 id="goals"></h1>
        <div class="stats">
          <div class="stat saved">
            <span class="stat-label">省下</span
            ><strong class="stat-value" id="saved-stat"></strong>
          </div>
          <div class="stat">
            <span class="stat-label">建议看</span
            ><strong class="stat-value" id="recommended-stat"></strong>
          </div>
          <div class="stat">
            <span class="stat-label">总长</span
            ><strong class="stat-value" id="total-stat"></strong>
          </div>
        </div>
      </section>

      <section class="learning">
        <h2>从这里开始</h2>
        <div class="path" id="learning-path"></div>
      </section>
      <p class="link-status" id="link-status" role="status" hidden></p>

      <main class="workspace">

    <script>
      "use strict";
      (() => {
        const DATA = JSON.parse(
          document.getElementById("studylens-data").textContent,
        );
        const $ = (id) => document.getElementById(id);
        const video = $("player");
        const labels = {
          must: "重点",
          normal: "一般",
          speed: "加速",
          skip: "跳过",
        };
        const PATH_LIMIT = 5;
        const videos = new Map(DATA.videos.map((v) => [v.id, v]));
        const opened = new Set();
        let current = null,
          segmentIndex = -1,
          baseRate = 1,
          ownRateEvents = 0;
        let internalSeek = null,
          pendingSeek = null,
          manualSkip = null,
          wantsPlay = false;
        let skipTimer = null,
          shareTimer = null,
          skipped = null;
        function el(tag, className = "", text = "") {
          const node = document.createElement(tag);
          if (className) node.className = className;
          node.textContent = text;
          return node;
        }
        function storeGet(key, fallback) {
          try {
            return localStorage.getItem("studylens." + key) ?? fallback;
          } catch {
            return fallback;
          }
        }
        function storeSet(key, value) {
          try {
            localStorage.setItem("studylens." + key, value);
          } catch {
            /* optional persistence */
          }
        }
        function time(n) {
          n = Math.max(0, Math.floor(n || 0));
          return n >= 3600
            ? `${Math.floor(n / 3600)}:${String(Math.floor(n / 60) % 60).padStart(2, "0")}:${String(n % 60).padStart(2, "0")}`
            : `${String(Math.floor(n / 60)).padStart(2, "0")}:${String(n % 60).padStart(2, "0")}`;
        }
        function duration(n) {
          const h = Math.floor(n / 3600),
            m = Math.floor((n % 3600) / 60),
            s = Math.round(n % 60);
          return h
            ? `${h}时 ${m}分`
            : m
              ? `${m}分${s ? " " + s + "秒" : ""}`
              : `${s}秒`;
        }
        function mediaURL(path) {
          return path
            .split("/")
            .map((part) => encodeURIComponent(part))
            .join("/");
        }
        function badge(label) {
          return el("span", "badge " + label, labels[label]);
        }
        function fillStrip(strip, v) {
          strip.replaceChildren();
          v.segments.forEach((s) => {
            const block = el("span", s.label);
            block.style.flexGrow = String(s.end - s.start);
            block.title = `${time(s.start)} ${labels[s.label]} · ${s.title}`;
            strip.append(block);
          });
        }
        // 进度条下方的段落条：每块可点击跳到该段开头，悬停显示内容
        function fillSeekStrip(v) {
          const strip = $("seek-strip"),
            tip = $("strip-tip");
          strip.replaceChildren(tip);
          tip.hidden = true;
          v.segments.forEach((s, i) => {
            const block = el("button", s.label);
            block.type = "button";
            block.dataset.segmentIndex = String(i);
            block.style.flexGrow = String(s.end - s.start);
            block.setAttribute(
              "aria-label",
              `${time(s.start)} ${labels[s.label]} ${s.title}`,
            );
            const show = () => {
              const head = el("b", "", `${time(s.start)} · ${labels[s.label]}`);
              tip.replaceChildren(head, document.createTextNode(s.title));
              tip.hidden = false;
              const center = block.offsetLeft + block.offsetWidth / 2,
                half = tip.offsetWidth / 2;
              tip.style.left =
                Math.min(Math.max(center, half), strip.clientWidth - half) +
                "px";
            };
            const hide = () => (tip.hidden = true);
            block.addEventListener("mouseenter", show);
            block.addEventListener("focus", show);
            block.addEventListener("mouseleave", hide);
            block.addEventListener("blur", hide);
            block.addEventListener("click", () =>
              navigate(v.id, s.start, true),
            );
            strip.append(block);
          });
        }
        function setLabel(button, text) {
          button.setAttribute("aria-label", text);
          button.title = text;
        }

        function theme(dark) {
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          setLabel($("theme-toggle"), dark ? "切换浅色" : "切换深色");
          $("theme-toggle").setAttribute("aria-pressed", String(dark));
        }
        theme(
          storeGet(
            "theme",
            matchMedia("(prefers-color-scheme:dark)").matches
              ? "dark"
              : "light",
          ) === "dark",
        );
        $("theme-toggle").addEventListener("click", () => {
          const dark = document.documentElement.dataset.theme !== "dark";
          theme(dark);
          storeSet("theme", dark ? "dark" : "light");
        });
        $("smart-mode").checked = storeGet("smart", "false") === "true";

        $("goals").textContent = DATA.profile.goals.join(" / ");
        for (const [id, key] of [
          ["total-stat", "total_sec"],
          ["recommended-stat", "recommended_sec"],
          ["saved-stat", "saved_sec"],
        ])
          $(id).textContent = duration(DATA.library.stats[key]);

        const path = DATA.library.learning_path;
        path.forEach((ref, i) => {
          const v = videos.get(ref.video_id),
            s = v.segments[ref.segment_index],
            button = el("button", "path-step");
          button.type = "button";
          button.title = ref.reason;
          button.hidden = i >= PATH_LIMIT;
          button.append(
            el("span", "step-number", String(i + 1)),
            el("span", "step-title", s.title),
            el("span", "step-meta", time(s.start)),
          );
          button.addEventListener("click", () => navigate(v.id, s.start, true));
          $("learning-path").append(button);
        });
        if (path.length > PATH_LIMIT) {
          const more = el("button", "path-more", `显示全部 ${path.length} 段`);
          more.type = "button";
          more.addEventListener("click", () => {
            $("learning-path")
              .querySelectorAll(".path-step")
              .forEach((node) => (node.hidden = false));
            more.remove();
          });
          $("learning-path").append(more);
        }
        if (!path.length)
          $("learning-path").append(
            el("p", "path-empty", "暂无推荐片段，可在目录中查看全部内容。"),
          );
        for (const topic of Object.keys(DATA.library.topic_index)) {
          const option = el("option", "", topic);
          option.value = topic;
          $("topic-filter").append(option);
        }

        function renderCatalog() {
          const query = $("search").value.trim().toLocaleLowerCase(),
            onlyMust = $("must-only").checked,
            topic = $("topic-filter").value;
          const allowed = topic
            ? new Set(
                DATA.library.topic_index[topic].map(
                  (r) => r.video_id + ":" + r.segment_index,
                ),
              )
            : null;
          const container = $("catalog");
          container.replaceChildren();
          let count = 0;
          const ordered = DATA.videos.map((v, index) => ({ v, index }));
          if ($("catalog-order").value === "relevance")
            ordered.sort(
              (a, b) => b.v.relevance - a.v.relevance || a.index - b.index,
            );
          ordered.forEach(({ v }) => {
            const videoMatch = (
              v.title +
              " " +
              v.summary +
              " " +
              v.topics.join(" ")
            )
              .toLocaleLowerCase()
              .includes(query);
            const matches = v.segments
              .map((s, i) => ({ s, i }))
              .filter(
                ({ s, i }) =>
                  (!onlyMust || s.label === "must") &&
                  (!allowed || allowed.has(v.id + ":" + i)) &&
                  (!query ||
                    videoMatch ||
                    (
                      s.title +
                      " " +
                      s.summary +
                      " " +
                      s.reason +
                      " " +
                      s.keypoints.join(" ")
                    )
                      .toLocaleLowerCase()
                      .includes(query)),
              );
            if (!matches.length) return;
            count++;
            const details = el("details", "video-entry");
            details.dataset.videoId = v.id;
            details.open = opened.has(v.id);
            details.addEventListener("toggle", () => {
              if (details.open) opened.add(v.id);
              else opened.delete(v.id);
            });
            const summary = el("summary"),
              top = el("div", "video-top");
            top.append(
              el("span", "video-title", v.title),
              el("span", "video-duration", duration(v.duration_sec)),
            );
            const mini = el("div", "mini");
            mini.setAttribute("role", "img");
            mini.setAttribute(
              "aria-label",
              v.segments.map((s) => labels[s.label]).join("、"),
            );
            fillStrip(mini, v);
            summary.append(top, mini);
            details.append(summary, el("p", "video-summary", v.summary));
            const list = el("div", "segment-list");
            matches.forEach(({ s, i }) => {
              const row = el("article", "segment " + s.label);
              row.dataset.videoId = v.id;
              row.dataset.segmentIndex = String(i);
              const jump = el("button", "segment-jump");
              jump.type = "button";
              jump.dataset.videoId = v.id;
              jump.dataset.segmentIndex = String(i);
              jump.title = s.summary;
              jump.setAttribute(
                "aria-label",
                `${time(s.start)} ${s.title} ${labels[s.label]}`,
              );
              jump.append(
                el("span", "time", time(s.start)),
                el("span", "segment-name", s.title),
                badge(s.label),
              );
              jump.addEventListener("click", () =>
                navigate(v.id, s.start, true),
              );
              row.append(jump);
              list.append(row);
            });
            details.append(list);
            container.append(details);
          });
          if (!count) container.append(el("p", "empty", "没有匹配的片段"));
          const filtered = query || onlyMust || topic;
          $("catalog-count").textContent = filtered
            ? `${count} / ${DATA.videos.length}`
            : "";
          highlight();
        }
        for (const id of [
          "search",
          "must-only",
          "topic-filter",
          "catalog-order",
        ])
          $(id).addEventListener(
            id === "search" ? "input" : "change",
            renderCatalog,
          );

        function findSegment(t) {
          return current
            ? current.segments.findIndex(
                (s, i) =>
                  t >= s.start &&
                  (t < s.end ||
                    (i === current.segments.length - 1 && t <= s.end)),
              )
            : -1;
        }
        function highlight() {
          document.querySelectorAll(".segment").forEach((node) => {
            const active =
              !!current &&
              node.dataset.videoId === current.id &&
              Number(node.dataset.segmentIndex) === segmentIndex;
            node.classList.toggle("active", active);
            const button = node.querySelector("button");
            if (active) button.setAttribute("aria-current", "true");
            else button.removeAttribute("aria-current");
          });
          $("seek-strip")
            .querySelectorAll("button")
            .forEach((node) =>
              node.classList.toggle(
                "active",
                Number(node.dataset.segmentIndex) === segmentIndex,
              ),
            );
        }
        function setRate(value) {
          if (Math.abs(video.playbackRate - value) > 0.001) {
            ownRateEvents++;
            video.playbackRate = value;
          }
          // 只在智能加速改变速度时提示当前倍速
          $("rate-status").textContent = `${value}×`;
          $("rate-status").hidden = Math.abs(value - baseRate) < 0.001;
        }
        function syncBaseSelector() {
          const select = $("base-rate");
          if (
            !Array.from(select.options).some(
              (o) => Number(o.value) === baseRate,
            )
          ) {
            const option = el("option", "", baseRate + "×");
            option.value = String(baseRate);
            select.append(option);
          }
          select.value = String(baseRate);
        }
        function seekTo(t, manual = true) {
          if (!current) return;
          const limit = Number.isFinite(video.duration)
            ? Math.min(current.duration_sec, video.duration)
            : current.duration_sec;
          const target = Math.min(Math.max(Number(t) || 0, 0), limit);
          const i = findSegment(target);
          if (manual)
            manualSkip =
              i >= 0 && current.segments[i].label === "skip" ? i : null;
          if (video.readyState === 0) {
            pendingSeek = { time: target, manual };
            return;
          }
          internalSeek = { time: target, manual };
          video.currentTime = target;
          updateView();
        }
        function smart() {
          if (!current || pendingSeek || video.seeking) return;
          const i = findSegment(video.currentTime),
            s = current.segments[i];
          if (manualSkip !== null && manualSkip !== i) manualSkip = null;
          const enabled = $("smart-mode").checked;
          setRate(enabled && s && s.label === "speed" ? s.speed : baseRate);
          if (
            enabled &&
            s &&
            s.label === "skip" &&
            manualSkip !== i &&
            !video.paused &&
            !video.ended
          ) {
            skipped = { videoId: current.id, start: s.start };
            $("skip-message").textContent = "已跳过：" + s.title;
            $("skip-toast").hidden = false;
            clearTimeout(skipTimer);
            skipTimer = setTimeout(() => {
              $("skip-toast").hidden = true;
            }, 3000);
            seekTo(s.end, false);
          }
        }
        function updateView() {
          if (!current) return;
          const t = pendingSeek
            ? Number(pendingSeek.time)
            : Number.isFinite(video.currentTime)
              ? video.currentTime
              : 0;
          $("position").textContent =
            `${time(t)} / ${time(current.duration_sec)}`;
          $("seek-bar").value = String(t);
          $("play-toggle").dataset.state = video.paused ? "paused" : "playing";
          setLabel($("play-toggle"), video.paused ? "播放" : "暂停");
          const next = findSegment(t);
          if (segmentIndex !== next) {
            segmentIndex = next;
            const s = current.segments[next];
            $("current-title").textContent = s ? s.title : "当前时间没有标注";
            $("current-summary").textContent = s ? s.summary : "";
            $("current-badge").textContent = s ? labels[s.label] : "一般";
            $("current-badge").className = "badge " + (s ? s.label : "normal");
            $("current-reason").textContent = s ? s.reason : "";
            $("current-keypoints").replaceChildren();
            if (s)
              s.keypoints.forEach((p) =>
                $("current-keypoints").append(el("li", "", p)),
              );
            highlight();
          }
          $("share-link").value = shareURL(t);
        }
        function shareURL(t) {
          if (!current) return "";
          return (
            location.href.split("#")[0] +
            "#" +
            new URLSearchParams({
              v: current.id,
              t: String(Math.round(t * 1000) / 1000),
            }).toString()
          );
        }
        function navigate(id, t = 0, play = false) {
          const next = videos.get(id);
          if (!next) return;
          if (play && matchMedia("(max-width:1050px)").matches) {
            requestAnimationFrame(() =>
              $("player-panel").scrollIntoView({
                behavior: matchMedia("(prefers-reduced-motion: reduce)").matches
                  ? "auto"
                  : "smooth",
                block: "start",
              }),
            );
          }
          $("link-status").hidden = true;
          opened.add(id);
          wantsPlay = play;
          if (current && current.id === id) {
            seekTo(t, true);
            if (play) video.play().catch(() => {});
            renderCatalog();
            return;
          }
          video.pause();
          current = next;
          segmentIndex = -2;
          manualSkip = null;
          internalSeek = null;
          pendingSeek = { time: t, manual: true };
          setRate(baseRate);
          $("playing-title").textContent = current.title;
          $("video-duration").textContent = duration(current.duration_sec);
          $("seek-bar").max = String(current.duration_sec);
          fillSeekStrip(current);
          $("play-error").hidden = true;
          $("error-path").textContent = current.path;
          video.src = mediaURL(current.path);
          video.load();
          renderCatalog();
          updateView();
        }

        video.addEventListener("loadedmetadata", () => {
          const target = pendingSeek;
          pendingSeek = null;
          setRate(baseRate);
          if (target) seekTo(target.time, target.manual);
          if (wantsPlay) video.play().catch(() => {});
          updateView();
        });
        video.addEventListener("seeking", () => {
          if (!current) return;
          if (
            !internalSeek ||
            Math.abs(video.currentTime - internalSeek.time) > 0.2
          ) {
            const i = findSegment(video.currentTime);
            manualSkip =
              i >= 0 && current.segments[i].label === "skip" ? i : null;
          }
          updateView();
        });
        video.addEventListener("seeked", () => {
          internalSeek = null;
          updateView();
          smart();
        });
        video.addEventListener("timeupdate", () => {
          updateView();
          smart();
        });
        video.addEventListener("play", () => {
          updateView();
          smart();
        });
        video.addEventListener("pause", updateView);
        video.addEventListener("ended", () => {
          setRate(baseRate);
          updateView();
        });
        video.addEventListener("error", () => {
          $("play-error").hidden = false;
        });
        video.addEventListener("ratechange", () => {
          if (ownRateEvents > 0) {
            ownRateEvents--;
            return;
          }
          baseRate = video.playbackRate;
          syncBaseSelector();
          smart();
        });
        $("base-rate").addEventListener("change", () => {
          baseRate = Number($("base-rate").value);
          smart();
          if (!$("smart-mode").checked) setRate(baseRate);
        });
        $("smart-mode").addEventListener("change", () => {
          storeSet("smart", String($("smart-mode").checked));
          smart();
        });
        $("seek-bar").addEventListener("input", () =>
          seekTo(Number($("seek-bar").value), true),
        );
        $("play-toggle").addEventListener("click", () => {
          if (video.paused)
            video.play().catch(() => {
              $("play-error").hidden = false;
            });
          else video.pause();
        });

        function syncVolume() {
          $("volume").value = String(video.volume);
          setLabel($("mute-toggle"), video.muted ? "取消静音" : "静音");
          $("mute-toggle").setAttribute("aria-pressed", String(video.muted));
        }
        video.addEventListener("volumechange", syncVolume);
        $("volume").addEventListener("input", () => {
          video.volume = Number($("volume").value);
          video.muted = video.volume === 0;
          syncVolume();
        });
        $("mute-toggle").addEventListener("click", () => {
          video.muted = !video.muted;
          syncVolume();
        });
        $("fullscreen-toggle").addEventListener("click", async () => {
          try {
            if (document.fullscreenElement) await document.exitFullscreen();
            else if ($("player-panel").requestFullscreen)
              await $("player-panel").requestFullscreen();
            else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
            else throw new Error("unsupported");
            $("control-status").textContent = "";
          } catch {
            $("control-status").textContent =
              "当前浏览器不支持全屏，可使用浏览器全屏功能。";
          }
        });
        document.addEventListener("fullscreenchange", () => {
          const full = !!document.fullscreenElement;
          $("fullscreen-toggle").dataset.state = full ? "full" : "";
          setLabel($("fullscreen-toggle"), full ? "退出全屏" : "全屏");
        });
        $("skip-back").addEventListener("click", () => {
          if (skipped) {
            $("skip-toast").hidden = true;
            clearTimeout(skipTimer);
            navigate(skipped.videoId, skipped.start, true);
          }
        });

        function flashShare(text) {
          $("share-status").textContent = text;
          clearTimeout(shareTimer);
          shareTimer = setTimeout(() => {
            $("share-status").textContent = "";
          }, 2000);
        }
        $("share-button").addEventListener("click", async () => {
          const link = shareURL(
            pendingSeek ? pendingSeek.time : video.currentTime,
          );
          $("share-link").value = link;
          try {
            history.replaceState(null, "", link);
          } catch {
            /* file browsers may restrict history */
          }
          try {
            await navigator.clipboard.writeText(link);
            $("share-fallback").hidden = true;
            flashShare("已复制");
          } catch {
            // 剪贴板不可用时才显示链接，供手动复制
            $("share-fallback").hidden = false;
            $("share-link").focus();
            $("share-link").select();
          }
        });

        function fromHash() {
          const params = new URLSearchParams(location.hash.slice(1));
          if (!params.has("v")) return false;
          const id = params.get("v"),
            t = Number(params.get("t") || 0),
            v = videos.get(id);
          if (!v || !Number.isFinite(t) || t < 0 || t > v.duration_sec) {
            $("link-status").textContent = "链接中的影片或时间无效";
            $("link-status").hidden = false;
            return false;
          }
          navigate(id, t, false);
          return true;
        }
        window.addEventListener("hashchange", fromHash);
        renderCatalog();
        if (!fromHash() && DATA.videos.length) {
          const invalidLink = !$("link-status").hidden;
          const first = [...DATA.videos].sort(
            (a, b) => b.relevance - a.relevance,
          )[0];
          navigate(first.id, 0, false);
          if (invalidLink) $("link-status").hidden = false;
        }
      })();
    </script>
  </body>
</html>
